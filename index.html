  <style>
    html {
      scroll-behavior: smooth;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      line-height: 1.6;
    }

    a {
      text-decoration: none;
    }

    /* HEADER */

    header {
      background: rgba(11, 17, 32, 0.95);
      border-bottom: 1px solid #1e293b;
      padding: 15px 30px;
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(8px);
    }

    .header-container {
      max-width: 1200px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo {
      height: 60px;
      width: auto;
      display: block;
    }

    .brand {
      font-weight: bold;
      font-size: 20px;
      color: #38bdf8;
    }

    .tagline {
      font-size: 14px;
      color: #94a3b8;
    }

    /* NAVIGATION */

    nav {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 15px;
      position: relative;
      transition: color 0.3s ease;
    }

    nav a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -6px;
      width: 0%;
      height: 2px;
      background: #38bdf8;
      transition: width 0.3s ease;
    }

    nav a:hover {
      color: #38bdf8;
    }

    nav a:hover::after {
      width: 100%;
    }

    /* DROPDOWN */

    .dropdown {
      position: relative;
      display: inline-block;
      padding-bottom: 18px;
      margin-bottom: -18px;
    }

    .dropbtn {
      color: white;
      text-decoration: none;
      font-size: 15px;
      position: relative;
      transition: color 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .dropbtn::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -6px;
      width: 0%;
      height: 2px;
      background: #38bdf8;
      transition: width 0.3s ease;
    }

    .dropdown-icon {
      font-size: 11px;
      transition: transform 0.3s ease, color 0.3s ease;
    }

    .dropdown:hover .dropbtn {
      color: #38bdf8;
    }

    .dropdown:hover .dropbtn::after {
      width: 100%;
    }

    .dropdown:hover .dropdown-icon {
      transform: rotate(180deg);
      color: #38bdf8;
    }

    .dropdown-content {
      display: block;
      position: absolute;
      top: 100%;
      left: 0;
      min-width: 260px;
      background: rgba(17, 24, 39, 0.96);
      border: 1px solid #1f2937;
      border-radius: 12px;
      box-shadow: 0 18px 34px rgba(0, 0, 0, 0.4);
      z-index: 1001;
      overflow: hidden;
      opacity: 0;
      visibility: hidden;
      transform: translateY(10px);
      transition: opacity 0.28s ease, transform 0.28s ease, visibility 0.28s ease;
      backdrop-filter: blur(8px);
    }

    .dropdown-content a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 16px;
      color: #e2e8f0;
      text-decoration: none;
      font-size: 15px;
      transition: background 0.3s ease, color 0.3s ease, padding-left 0.3s ease;
    }

    .dropdown-content a::after {
      display: none;
    }

    .dropdown-content a i {
      width: 18px;
      color: #38bdf8;
      text-align: center;
    }

    .dropdown-content a:hover {
      background: #0f172a;
      color: #38bdf8;
      padding-left: 20px;
    }

    .dropdown:hover .dropdown-content {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    /* QUOTE BUTTON */

    .quote-button {
      display: inline-block;
      background: linear-gradient(135deg, #0ea5e9, #2563eb);
      color: white !important;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
      white-space: nowrap;
      box-shadow: 0 10px 24px rgba(37, 99, 235, 0.25);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .quote-button::after {
      display: none;
    }

    .quote-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(37, 99, 235, 0.35);
      color: white !important;
    }

    /* CALL BUTTON */

    .call-btn {
      background: #38bdf8;
      color: black !important;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: bold;
      margin-left: 4px;
      transition: all 0.3s ease;
    }

    .call-btn::after {
      display: none;
    }

    .call-btn:hover {
      background: #0ea5e9;
      color: black !important;
    }

    /* HERO */

    .hero {
      text-align: center;
      padding: 160px 20px;
      background:
        radial-gradient(circle at center, rgba(56,189,248,0.15), transparent 60%),
        linear-gradient(rgba(2,6,23,0.75), rgba(2,6,23,0.90)),
        url("images/background.jpeg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .hero-content {
      max-width: 950px;
      margin: auto;
    }

    .hero h1 {
      font-size: 48px;
      color: #38bdf8;
      margin-bottom: 20px;
      line-height: 1.2;
      text-shadow:
        0 4px 18px rgba(0,0,0,0.6),
        0 0 25px rgba(56,189,248,0.25);
    }

    .hero p {
      font-size: 20px;
      color: #e2e8f0;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      padding: 14px 32px;
      background: #38bdf8;
      color: black;
      font-weight: bold;
      border-radius: 8px;
      font-size: 18px;
      transition: 0.3s;
      box-shadow: 0 8px 20px rgba(56, 189, 248, 0.3);
    }

    .btn:hover {
      background: #0ea5e9;
      transform: scale(1.05);
    }

    /* GENERAL SECTION */

    .section-title {
      color: #38bdf8;
      font-size: 36px;
      margin-bottom: 10px;
      text-align: center;
    }

    .section-intro {
      max-width: 760px;
      margin: auto;
      color: #cbd5f5;
      margin-bottom: 40px;
      font-size: 17px;
      text-align: center;
    }

    /* SERVICES */

    .services {
      padding: 90px 20px;
      text-align: center;
    }

    .services-grid {
      max-width: 1120px;
      margin: auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
    }

    /* SERVICE CARDS */

    .service-image,
    .security-image,
    .wifi-image {
      height: 300px;
      max-width: 380px;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      border-radius: 12px;
      border: 1px solid #334155;
      overflow: hidden;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
      color: inherit;
      transition: transform 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
      position: relative;
    }

    .service-image {
      background-image: url("images/structured-cabling.jpg");
    }

    .security-image {
      background-image: url("images/security-systems.jpg");
    }

    .wifi-image {
      background-image: url("images/commercial-wifi.jpg");
    }

    .service-image::before,
    .security-image::before,
    .wifi-image::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(
        120deg,
        transparent,
        rgba(255,255,255,0.15),
        transparent
      );
      transform: skewX(-25deg);
      transition: 0.6s;
      z-index: 1;
      pointer-events: none;
    }

    .service-image::after,
    .security-image::after,
    .wifi-image::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 12px;
      box-shadow: inset 0 0 0 1px rgba(56,189,248,0);
      transition: box-shadow 0.35s ease;
      pointer-events: none;
      z-index: 1;
    }

    .service-image:hover::before,
    .security-image:hover::before,
    .wifi-image:hover::before {
      left: 130%;
    }

    .service-image:hover,
    .security-image:hover,
    .wifi-image:hover {
      transform: translateY(-10px);
      border-color: #38bdf8;
      box-shadow:
        0 18px 34px rgba(0, 0, 0, 0.3),
        0 0 24px rgba(56, 189, 248, 0.18);
    }

    .service-image:hover::after,
    .security-image:hover::after,
    .wifi-image:hover::after {
      box-shadow: inset 0 0 0 1px rgba(56,189,248,0.45);
    }

    .service-overlay {
      background: linear-gradient(
        rgba(0, 0, 0, 0),
        rgba(0, 0, 0, 0.35),
        rgba(0, 0, 0, 0.85)
      );
      padding: 95px 22px 35px 22px;
      border-radius: 0 0 12px 12px;
      text-align: left;
      width: 100%;
      position: relative;
      z-index: 2;
    }

    .service-overlay h3 {
      margin: 4px 0 2px 0;
      font-size: 28px;
      border-bottom: 2px solid white;
      padding-bottom: 4px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .service-overlay h3 i {
      color: #38bdf8;
      font-size: 24px;
    }

    .service-list {
      padding-left: 18px;
      color: #e5e7eb;
      margin: 0;
      font-size: 17px;
    }

    .service-list li {
      margin-bottom: 8px;
    }

    /* WHY CHOOSE US */

    .why-choose {
      padding: 90px 20px;
      background: #111827;
    }

    .why-grid {
      max-width: 1100px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
    }

    .why-card {
      background: #0f172a;
      border: 1px solid #1f2937;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
    }

    .why-card h3 {
      margin-top: 0;
      color: #f8fafc;
      font-size: 22px;
    }

    .why-card p {
      color: #cbd5e1;
      margin-bottom: 0;
    }

    /* WHY TOGGLE */

    .why-toggle {
      max-width: 1100px;
      margin: auto;
    }

    .why-toggle summary {
      cursor: pointer;
      list-style: none;
      text-align: center;
      background: #0f172a;
      border: 1px solid #1f2937;
      border-radius: 14px;
      padding: 22px 28px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
      transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease;
      user-select: none;
    }

    .why-toggle summary:hover {
      border-color: #38bdf8;
      box-shadow:
        0 14px 28px rgba(0, 0, 0, 0.22),
        0 0 20px rgba(56, 189, 248, 0.12);
      transform: translateY(-2px);
    }

    .why-toggle summary::-webkit-details-marker {
      display: none;
    }

    .why-toggle summary::after {
      content: "▼";
      display: inline-block;
      margin-left: 12px;
      font-size: 16px;
      color: #38bdf8;
      transition: transform 0.3s ease;
    }

    .why-toggle[open] summary::after {
      transform: rotate(180deg);
    }

    .why-toggle[open] .section-intro,
    .why-toggle[open] .why-grid {
      animation: fadeInWhy 0.35s ease;
    }

    @keyframes fadeInWhy {
      from {
        opacity: 0;
        transform: translateY(-6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .why-toggle .section-intro {
      margin-top: 28px;
    }

    .why-toggle .why-grid {
      margin-top: 28px;
    }

    /* TECHNOLOGY SECTION */

    .technology-section {
      padding: 90px 20px;
      background: #0b1120;
    }

    .tech-grid {
      max-width: 1100px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
    }

    .tech-card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
    }

    .tech-card h3 {
      margin-top: 0;
      color: #f8fafc;
      font-size: 22px;
    }

    .tech-card ul {
      margin: 0;
      padding-left: 18px;
      color: #cbd5e1;
    }

    .tech-card li {
      margin-bottom: 8px;
    }

    /* PROJECT EXAMPLES */

    .projects-section {
      padding: 90px 20px;
      background: #0f172a;
    }

    .projects-grid {
      max-width: 1100px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
    }

    .project-card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
    }

    .project-card h3 {
      margin-top: 0;
      color: #f8fafc;
      font-size: 22px;
    }

    .project-card ul {
      margin: 0;
      padding-left: 18px;
      color: #cbd5e1;
    }

    .project-card li {
      margin-bottom: 8px;
    }

    /* SERVICE AREAS */

    .service-areas {
      padding: 50px 20px;
      text-align: center;
      scroll-margin-top: 80px;
      background:
        linear-gradient(rgba(2, 6, 23, 0.35), rgba(15, 23, 42, 0.50)),
        url("images/houston-skyline.jpg");
      background-size: cover;
      background-position: center bottom;
      background-repeat: no-repeat;
    }

    .service-areas h2 {
      font-size: 36px;
      color: #38bdf8;
      margin: 0 0 20px 0;
    }

    .service-areas p {
      max-width: 760px;
      margin: auto;
      font-size: 18px;
      color: #e2e8f0;
    }

    .bold-line {
      margin-top: 20px !important;
      font-weight: bold;
    }

    /* MAP SECTION */

    .map-section {
      padding: 90px 20px;
      background: #111827;
      text-align: center;
    }

    .map-wrap {
      max-width: 1100px;
      margin: 35px auto 0;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #1f2937;
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.28);
    }

    .map-wrap iframe {
      width: 100%;
      height: 420px;
      border: 0;
      display: block;
    }

    /* CONTACT */

    .contact {
      padding: 90px 20px;
      text-align: center;
      background: #0f172a;
    }

    .contact h2 {
      color: #38bdf8;
      font-size: 36px;
      margin: 0 0 20px 0;
    }

    .contact p {
      color: #e2e8f0;
      font-size: 18px;
    }

    .contact a {
      color: #38bdf8;
    }

    /* SEO */

    .seo-section {
      padding: 70px 20px;
      text-align: center;
      background: #0b1120;
    }

    .seo-section h2 {
      color: #38bdf8;
      font-size: 34px;
      margin: 0 0 20px 0;
    }

    .seo-section p {
      max-width: 850px;
      margin: auto;
      color: #cbd5f5;
      font-size: 17px;
    }

    /* QUOTE */

    .quote-section {
      padding: 90px 20px;
      background:
        linear-gradient(rgba(2,6,23,0.85), rgba(2,6,23,0.85)),
        url("images/request-a-quote-datacenter-rack.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .quote-section h2 {
      color: #38bdf8;
      font-size: 36px;
      margin: 0 0 10px 0;
      text-align: center;
    }

    .quote-intro {
      color: #cbd5f5;
      margin-bottom: 40px;
      font-size: 17px;
      text-align: center;
    }

    .quote-layout {
      max-width: 1100px;
      margin: auto;
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 28px;
      align-items: start;
    }

    .quote-card {
      background: rgba(17,24,39,0.92);
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 28px;
      backdrop-filter: blur(6px);
      box-shadow:
        0 20px 40px rgba(0,0,0,0.45),
        0 0 25px rgba(56,189,248,0.08);
    }

    .quote-card h3 {
      margin-top: 0;
      color: #f8fafc;
      font-size: 24px;
    }

    .quote-form {
      display: grid;
      gap: 16px;
    }

    .quote-form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .quote-form input,
    .quote-form select,
    .quote-form textarea {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      font-size: 16px;
    }

    .quote-form input::placeholder,
    .quote-form textarea::placeholder {
      color: #94a3b8;
    }

    .quote-form textarea {
      resize: vertical;
      min-height: 140px;
    }

    .quote-form button {
      padding: 14px;
      background: linear-gradient(135deg, #0ea5e9, #2563eb);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 18px;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 10px 24px rgba(37, 99, 235, 0.25);
    }

    .quote-form button:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(37, 99, 235, 0.35);
    }

    .quote-side-list {
      margin: 0;
      padding-left: 18px;
      color: #cbd5e1;
    }

    .quote-side-list li {
      margin-bottom: 10px;
    }

    .highlight-box {
      margin-top: 24px;
      padding: 18px;
      border-radius: 12px;
      background: rgba(14, 165, 233, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.22);
      color: #cbd5e1;
    }

    .highlight-box strong {
      color: #f8fafc;
    }

    /* FOOTER */

    footer {
      background: #111827;
      padding: 40px 20px;
    }

    .footer-container {
      max-width: 1100px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 24px;
    }

    .footer-column h3 {
      margin-top: 0;
      color: #f8fafc;
    }

    .footer-column p,
    .footer-column li,
    .footer-column a {
      color: #94a3b8;
      font-size: 15px;
      margin: 0 0 10px 0;
      text-decoration: none;
    }

    .footer-column ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .footer-bottom {
      text-align: center;
      padding-top: 25px;
      margin-top: 25px;
      border-top: 1px solid #1f2937;
      color: #94a3b8;
      font-size: 14px;
    }

    /* MOBILE */

    @media (max-width: 900px) {
      .why-grid,
      .tech-grid,
      .projects-grid,
      .quote-layout,
      .footer-container,
      .quote-form-row {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 768px) {
      header {
        padding: 15px 20px;
      }

      .header-container {
        justify-content: center;
        text-align: center;
      }

      .logo-area {
        justify-content: center;
      }

      nav {
        justify-content: center;
      }

      .dropdown-content {
        left: 50%;
        transform: translateX(-50%) translateY(10px);
      }

      .dropdown:hover .dropdown-content {
        transform: translateX(-50%) translateY(0);
      }

      .call-btn,
      .quote-button {
        margin-left
